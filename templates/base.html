<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <title>{% block titulo %}Guia Halloween: The Game{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Creepster&family=Nunito+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  {% block head_extra %}{% endblock %}
</head>
<body>
  <div class="neblina" aria-hidden="true"></div>
  <div class="grao" aria-hidden="true"></div>
  <div class="vinheta-tela" aria-hidden="true"></div>

  <input type="checkbox" id="menu-toggle" class="menu-toggle-input">

  <header class="topo-mobile">
    <a href="{{ url_for('index') }}" class="marca">
      <img class="marca-logo" src="{{ url_for('static', filename='images/logo.png') }}" alt="Halloween: The Game">
    </a>

    <label for="menu-toggle" class="menu-botao" aria-label="Abrir menu">
      <svg class="icone-abrir" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <path d="M4 7h16M4 12h16M4 17h16" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
      </svg>
      <svg class="icone-fechar" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
      </svg>
    </label>
    <div class="goteira goteira-mobile" aria-hidden="true"><span></span><span></span><span></span></div>
  </header>

  <div class="layout">
    <aside class="sidebar" id="sidebar">
      <a href="{{ url_for('index') }}" class="marca marca-sidebar">
        <img class="marca-logo" src="{{ url_for('static', filename='images/logo.png') }}" alt="Halloween: The Game">
      </a>
      <div class="goteira" aria-hidden="true"><span></span><span></span><span></span></div>

      <nav class="nav">
        <a href="{{ url_for('index') }}" class="{{ 'ativo' if request.endpoint == 'index' else '' }}">
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M4 11.5 12 4l8 7.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M6 10.5V20h12v-9.5" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>
          Início
        </a>
        <a href="{{ url_for('mapas') }}" class="{{ 'ativo' if request.endpoint in ('mapas', 'mapa_detalhe') else '' }}">
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M9 4 4 6v14l5-2 6 2 5-2V4l-5 2-6-2Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><path d="M9 4v14M15 6v14" stroke="currentColor" stroke-width="1.6"/></svg>
          Mapas
        </a>
        <a href="{{ url_for('guias') }}" class="{{ 'ativo' if request.endpoint in ('guias', 'guia_detalhe') else '' }}">
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M5 5.5c0-.8.7-1.5 1.5-1.5H12v16H6.5A1.5 1.5 0 0 0 5 21.5v-16Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><path d="M19 5.5c0-.8-.7-1.5-1.5-1.5H12v16h5.5a1.5 1.5 0 0 1 1.5 1.5v-16Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>
          Guias
        </a>
        <a href="{{ url_for('estrategias') }}" class="{{ 'ativo' if request.endpoint == 'estrategias' else '' }}">
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 2 14.4 8.6 21 9.3 16 13.7 17.5 20.3 12 16.8 6.5 20.3 8 13.7 3 9.3 9.6 8.6 12 2Z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></svg>
          Guia Completo
        </a>
        <div class="nav-sub">
          <a href="{{ url_for('estrategias') }}#michael" class="nav-sub-link" data-aba-alvo="michael">
            <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 3c-4 0-6 3-6 6.5 0 1 .2 1.9.6 2.7C5 13.4 3 15.8 3 19h18c0-3.2-2-5.6-3.6-6.8.4-.8.6-1.7.6-2.7C18 6 16 3 12 3Z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/><circle cx="9.3" cy="11.5" r="1.1" fill="currentColor"/><circle cx="14.7" cy="11.5" r="1.1" fill="currentColor"/></svg>
            Michael Myers
          </a>
          <a href="{{ url_for('estrategias') }}#sobreviventes" class="nav-sub-link" data-aba-alvo="sobreviventes">
            <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8Z" stroke="currentColor" stroke-width="1.6"/><path d="M4 20c0-3.6 3.4-6.5 8-6.5s8 2.9 8 6.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
            Sobreviventes
          </a>
        </div>
      </nav>
    </aside>
    <label for="menu-toggle" class="menu-fundo"></label>

    <div class="area-principal">
      <main class="conteudo">
        {% block conteudo %}{% endblock %}
      </main>

      <footer class="rodape">
        <p>Fã-site não oficial de Halloween: The Game.</p>
      </footer>
    </div>
  </div>

  <script src="{{ url_for('static', filename='js/revelar.js') }}"></script>
</body>
</html>
